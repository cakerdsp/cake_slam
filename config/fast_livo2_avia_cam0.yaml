%YAML:1.0
# FAST-LIVO2 camera_pinhole.yaml converted to camodocal pinhole format.
# The official file also has scale: 0.5, but cake_slam does not resize images
# from YAML, so these intrinsics target the raw 1280x1024 image topic.
model_type: PINHOLE
camera_name: fast_livo2_avia_cam0
image_width: 1280
image_height: 1024
distortion_parameters:
  k1: -0.076160
  k2: 0.123001
  p1: -0.00113
  p2: 0.000251
projection_parameters:
  fx: 1293.56944
  fy: 1293.3155
  cx: 626.91359
  cy: 522.799224
