%YAML:1.0
# FAST-LIVO2 camera_pinhole.yaml converted to camodocal pinhole format.
# The official file uses scale: 0.5, so cake_slam resizes incoming images to
# 640x512 and uses the correspondingly scaled pinhole intrinsics here.
model_type: PINHOLE
camera_name: fast_livo2_avia_cam0
image_width: 640
image_height: 512
distortion_parameters:
  k1: -0.076160
  k2: 0.123001
  p1: -0.00113
  p2: 0.000251
projection_parameters:
  fx: 646.78472
  fy: 646.65775
  cx: 313.456795
  cy: 261.399612
