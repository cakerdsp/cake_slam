%YAML:1.0
# FAST-LIVO2 camera_fisheye_HILTI22.yaml converted to camodocal format.
# FAST-LIVO2 uses an EquidistantCamera with scale: 1.0. camodocal stores the
# same Kannala-Brandt polynomial as k2..k5, where k1 is the fixed theta term.
model_type: KANNALA_BRANDT
camera_name: fast_livo2_hilti22_cam0
image_width: 720
image_height: 540
projection_parameters:
  k2: -0.03696737352869157
  k3: -0.008917880497032812
  k4: 0.008912969593422046
  k5: -0.0037685977496087313
  mu: 351.31400364193297
  mv: 351.4911744656785
  u0: 367.8522793375995
  v0: 253.8402144980996
